<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ariadne Zanardi - Moda e Estilo</title>
    <link rel="stylesheet" href="./style/index.css">
    <link rel="icon" type="image/png" href="./images/logo.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="header-placeholder"></div>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <img src="images/home/heart.png" alt="Imagem de coração" class="heart-img">
            <h1>Seu estilo, do seu<br>jeito!</h1>
            <p>Tendências, inspirações e combinações pensadas para você!</p>
            <!-- Fica invisível até o navAuth.js decidir: "Entrar" ou "Montar meu look" -->
            <a href="conta.html" class="btn-hero" id="heroAuthBtn" style="visibility:hidden">Entrar</a>
        </div>
        <div class="hero-image">
            <img src="images/home/tablet.jpg" alt="Fashion collage with pink flowers and polaroids">
        </div>
    </section>

    <!-- About Section -->
    <section class="about">
        <div class="about-image">
            <img src="images/home/modelo.JPG" alt="Ariadne Zanardi - Fashion student">
        </div>
        <div class="about-content">
            <span class="sparkle-icon">✦</span>
            <h2>Hello besties!</h2>
            <p class="subtitle">Vamos conversar sobre tendências?</p>
            <p>Meu nome é Ariadne Zanardi, sou estudante de Moda na PUCCamp e criei esse espaço para me conectar com
                você!</p>
            <a href="blog.html" class="btn-blog">Meu blog</a>
        </div>
    </section>
    
    <div id="footer-placeholder"></div>
    <script type="module" src="./database/layout.js"></script>

    <script type="module" src="./database/navAuth.js"></script>
    <script type="module">
        document.getElementById('year').textContent = new Date().getFullYear();

        // Segurança: se o navAuth.js falhar, o botão do hero não fica invisível para sempre
        setTimeout(() => {
            const heroBtn = document.getElementById('heroAuthBtn');
            if (heroBtn) heroBtn.style.visibility = '';
        }, 2000);
    </script>
</body>

</html>
